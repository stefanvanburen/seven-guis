name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

# One deploy at a time; a superseded run has nothing worth finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      # shadow-cljs compiles on the JVM.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      # Build on every branch, so a pull request verifies what would ship.
      - run: npm run build
      # Uploads public/ from the build step rather than rebuilding it.
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          XMIT_KEY: ${{ secrets.XMIT_KEY }}
        run: npm run deploy
